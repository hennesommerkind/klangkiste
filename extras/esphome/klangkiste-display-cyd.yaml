# =======================================================================
# CYD (ESP32-2432S028, 320×240, Touch) als Display für die Klangkiste
#
# Daten: MQTT-Thema klangkiste/state (kommt direkt von der Box)
# Bild:  http://<box>/api/display.jpg – Cover mit Figur, von der Box fertig
#        zusammengesetzt
# Tasten: schicken klangkiste/cmd/... an die Box
#
# In der secrets.yaml (ESPHome-Dashboard › Secrets) müssen stehen:
#   wifi_ssid, wifi_password, cyd_heizung__encryption_key,
#   klangkiste_mqtt_user, klangkiste_mqtt_password
# =======================================================================
substitutions:
  box: "192.168.178.63"          # Adresse der Klangkiste
  broker: "192.168.178.55"       # Home Assistant mit Mosquitto
  prefix: "klangkiste"           # Themen-Präfix aus den Box-Einstellungen

esphome:
  name: cyd-heizung              # Name bleibt, damit Updates per WLAN weiter klappen
  friendly_name: Klangkiste-Display
  on_boot:
    then:
      - script.execute: backlight_timeout

esp32:
  board: esp32dev
  framework:
    type: arduino

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Klangkiste-Display Hotspot"

logger:
api:
  encryption:
    key: !secret cyd_heizung__encryption_key
ota:
  - platform: esphome

http_request:
  useragent: esphome/klangkiste-display
  timeout: 10s

# -----------------------------------------------------------------------
# MQTT: Zustand der Box empfangen, Befehle senden
# -----------------------------------------------------------------------
mqtt:
  broker: ${broker}
  username: !secret klangkiste_mqtt_user
  password: !secret klangkiste_mqtt_password
  discovery: false               # das Display selbst kommt über die ESPHome-API nach HA
  topic_prefix: klangkiste-display
  log_topic: null
  on_json_message:
    - topic: ${prefix}/state
      then:
        - lambda: |-
            std::string st = x["state"] | "stop";
            std::string title = x["title"] | "";
            std::string folder = x["folder"] | "";
            std::string series = x["series"] | "";
            bool spotify = x["spotify"] | false;
            int ep = x["episode"] | 0, eps = x["episodes"] | 0;
            int tr = x["track"] | 0, trs = x["tracks"] | 0;

            id(k_playing) = (st == "play");
            id(k_elapsed) = x["elapsed"] | 0.0f;
            id(k_duration) = x["duration"] | 0.0f;
            id(k_volume) = x["volume"] | 0;
            int vmax = x["vmax"] | 100;
            id(k_vmax) = vmax > 0 ? vmax : 100;

            // Zeile über dem Titel: Serie, sonst der Ordner (ohne „Hörspiele/“ bzw. „Musik/“)
            std::string top;
            if (spotify) top = "Spotify";
            else if (!series.empty()) top = series;
            else if (!folder.empty()) {
              size_t p = folder.rfind('/');
              top = p == std::string::npos ? folder : folder.substr(p + 1);
            }
            id(k_top) = top;
            id(k_title) = title.empty() ? (folder.empty() && !spotify ? "Nichts ausgewählt" : "") : title;

            std::string sub;
            if (eps > 1) sub = "Folge " + to_string(ep) + " von " + to_string(eps);
            else if (trs > 1) sub = "Titel " + to_string(tr) + " von " + to_string(trs);
            id(k_sub) = sub;

            std::string img = x["image_v"] | "idle";
            id(k_img_changed) = (img != id(k_image_v));
            id(k_image_v) = img;
        - script.execute: refresh_ui
        - if:
            condition:
              lambda: 'return id(k_img_changed);'
            then:
              - online_image.set_url:
                  id: kk_cover
                  url: !lambda 'return std::string("http://${box}/api/display.jpg?size=132&bg=0A1929&v=") + id(k_image_v);'
              - component.update: kk_cover
              # neue Figur aufgelegt: Display kurz einschalten
              - light.turn_on: display_backlight
              - script.execute: backlight_timeout

online_image:
  - id: kk_cover
    url: "http://${box}/api/display.jpg?size=132&bg=0A1929"
    format: JPEG
    type: RGB565
    update_interval: never
    on_download_finished:
      - lvgl.image.update:
          id: cover_img
          src: kk_cover

# -----------------------------------------------------------------------
# Hardware (wie bisher)
# -----------------------------------------------------------------------
spi:
  - id: bus_tft
    clk_pin: GPIO14
    mosi_pin: GPIO13
    miso_pin: GPIO12
  - id: bus_touch
    clk_pin: GPIO25
    mosi_pin: GPIO32
    miso_pin: GPIO39

display:
  - platform: ili9xxx
    id: my_display
    model: ILI9341
    spi_id: bus_tft
    cs_pin: GPIO15
    dc_pin: GPIO2
    dimensions:
      width: 320
      height: 240
    color_order: bgr
    invert_colors: false
    update_interval: never

touchscreen:
  - platform: xpt2046
    id: my_touch
    spi_id: bus_touch
    cs_pin: GPIO33
    interrupt_pin: GPIO36
    update_interval: 50ms
    threshold: 400
    transform:
      swap_xy: true
      mirror_x: true
      mirror_y: true
    calibration:
      x_min: 340
      x_max: 3860
      y_min: 300
      y_max: 3860
    on_touch:
      - light.turn_on: display_backlight
      - script.execute: backlight_timeout

output:
  - platform: ledc
    pin: GPIO21
    id: backlight_pwm
    frequency: 1000Hz

light:
  - platform: monochromatic
    output: backlight_pwm
    name: "Display Hintergrundbeleuchtung"
    id: display_backlight
    restore_mode: ALWAYS_ON
    default_transition_length: 400ms

# -----------------------------------------------------------------------
# Zustand
# -----------------------------------------------------------------------
globals:
  - { id: k_playing, type: bool, initial_value: "false" }
  - { id: k_elapsed, type: float, initial_value: "0" }
  - { id: k_duration, type: float, initial_value: "0" }
  - { id: k_volume, type: int, initial_value: "0" }
  - { id: k_vmax, type: int, initial_value: "100" }
  - { id: k_top, type: std::string, initial_value: '""' }
  - { id: k_title, type: std::string, initial_value: '"Verbinde …"' }
  - { id: k_sub, type: std::string, initial_value: '""' }
  - { id: k_image_v, type: std::string, initial_value: '""' }
  - { id: k_img_changed, type: bool, initial_value: "false" }
  - { id: k_vol_busy, type: bool, initial_value: "false" }

script:
  - id: backlight_timeout
    mode: restart
    then:
      - delay: 60s
      - light.turn_off: display_backlight

  - id: refresh_ui
    mode: queued
    then:
      - lvgl.label.update: { id: lbl_top, text: !lambda 'return id(k_top);' }
      - lvgl.label.update: { id: lbl_title, text: !lambda 'return id(k_title);' }
      - lvgl.label.update: { id: lbl_sub, text: !lambda 'return id(k_sub);' }
      - lvgl.label.update:
          id: lbl_play
          text: !lambda 'return std::string(id(k_playing) ? "" : "");'
      - if:
          condition:
            lambda: 'return !id(k_vol_busy);'
          then:
            - lvgl.slider.update:
                id: sld_vol
                value: !lambda 'return (int) roundf(id(k_volume) * 100.0f / id(k_vmax));'
      - script.execute: refresh_time

  - id: refresh_time
    then:
      - lvgl.bar.update:
          id: bar_pos
          value: !lambda |-
            if (id(k_duration) <= 0) return 0;
            return (int) (1000.0f * std::min(id(k_elapsed), id(k_duration)) / id(k_duration));
      - lvgl.label.update:
          id: lbl_el
          text: !lambda |-
            int s = (int) id(k_elapsed);
            return id(k_duration) > 0 ? str_sprintf("%d:%02d", s / 60, s % 60) : std::string("");
      - lvgl.label.update:
          id: lbl_du
          text: !lambda |-
            int s = (int) id(k_duration);
            return s > 0 ? str_sprintf("%d:%02d", s / 60, s % 60) : std::string("");

# Spielzeit zwischen zwei Meldungen der Box selbst weiterzählen
interval:
  - interval: 1s
    then:
      - if:
          condition:
            lambda: 'return id(k_playing);'
          then:
            - lambda: 'id(k_elapsed) += 1.0f;'
            - script.execute: refresh_time

font:
  - file: "gfonts://Montserrat@600"
    id: font_12
    size: 12
    glyphs: &glyphs " !\"#$%&'()*+,-./0123456789:;<=>?@ABCDEFGHIJKLMNOPQRSTUVWXYZ[]_abcdefghijklmnopqrstuvwxyz|~°´·–—‘’‚“”„…ÄÖÜäöüßÀÁÂÇÈÉÊËÎÏÑÓÔÙÚÛàáâçèéêëîïñóôùúû€"
  - file: "gfonts://Montserrat@700"
    id: font_18
    size: 18
    glyphs: *glyphs

# -----------------------------------------------------------------------
# Oberfläche
# -----------------------------------------------------------------------
lvgl:
  displays: my_display
  touchscreens: my_touch
  style_definitions:
    - id: st_btn
      bg_color: 0x14283A
      bg_opa: COVER
      radius: 12
      border_width: 0
      shadow_width: 0
  widgets:
    - obj:
        x: 0
        y: 0
        width: 320
        height: 240
        radius: 0
        border_width: 0
        pad_all: 0
        bg_color: 0x0A1929
        bg_opa: COVER
        scrollable: false
        widgets:
          # Cover mit Figur (132×132, kommt fertig von der Box)
          - image:
              id: cover_img
              src: kk_cover
              x: 8
              y: 8

          # Texte rechts neben dem Cover
          - label:
              id: lbl_top
              x: 150
              y: 12
              width: 162
              text: ""
              long_mode: DOT
              text_color: 0x6BA3B8
              text_font: font_12
          - label:
              id: lbl_title
              x: 150
              y: 32
              width: 162
              height: 66
              text: "Verbinde …"
              long_mode: DOT
              text_color: 0xE1F5FE
              text_font: font_18
          - label:
              id: lbl_sub
              x: 150
              y: 100
              width: 162
              text: ""
              long_mode: DOT
              text_color: 0xFF8A65
              text_font: font_12

          # Fortschritt
          - bar:
              id: bar_pos
              x: 150
              y: 124
              width: 162
              height: 6
              min_value: 0
              max_value: 1000
              value: 0
              bg_color: 0x1B3A4B
              radius: 3
              indicator:
                bg_color: 0xFF7043
                radius: 3
          - label: { id: lbl_el, x: 150, y: 132, text: "", text_color: 0x90A4AE, text_font: font_12 }
          - label: { id: lbl_du, x: 262, y: 132, width: 50, text: "", text_align: RIGHT, text_color: 0x90A4AE, text_font: font_12 }

          # Tasten
          - button:
              styles: st_btn
              x: 20
              y: 152
              width: 76
              height: 48
              on_click:
                - mqtt.publish: { topic: "${prefix}/cmd/prev", payload: "" }
              widgets:
                - label: { align: CENTER, text: "", text_font: montserrat_24, text_color: 0xE1F5FE }
          - button:
              styles: st_btn
              x: 122
              y: 148
              width: 76
              height: 56
              bg_color: 0xFF7043
              radius: 28
              on_click:
                - mqtt.publish: { topic: "${prefix}/cmd/play_pause", payload: "" }
              widgets:
                - label: { id: lbl_play, align: CENTER, text: "", text_font: montserrat_28, text_color: 0xFFFFFF }
          - button:
              styles: st_btn
              x: 224
              y: 152
              width: 76
              height: 48
              on_click:
                - mqtt.publish: { topic: "${prefix}/cmd/next", payload: "" }
              widgets:
                - label: { align: CENTER, text: "", text_font: montserrat_24, text_color: 0xE1F5FE }

          # Lautstärke
          - label: { x: 12, y: 210, text: "", text_font: montserrat_18, text_color: 0x90A4AE }
          - slider:
              id: sld_vol
              x: 46
              y: 216
              width: 250
              height: 10
              min_value: 0
              max_value: 100
              value: 0
              bg_color: 0x1B3A4B
              indicator:
                bg_color: 0xFF7043
              knob:
                bg_color: 0xFFFFFF
                pad_all: 4
              on_press:
                - lambda: 'id(k_vol_busy) = true;'
              on_release:
                - lambda: 'id(k_vol_busy) = false;'
                - mqtt.publish:
                    topic: "${prefix}/cmd/volume"
                    payload: !lambda 'return to_string((int) roundf(x * id(k_vmax) / 100.0f));'
