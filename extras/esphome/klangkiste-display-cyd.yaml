# =======================================================================
# CYD (ESP32-2432S028, 320×240, Touch) als Display für die Klangkiste
#
# Zeigt, was läuft (Cover mit Figur, Serie, Titel, Folge, Fortschritt).
# Oben ein Karussell: in der Mitte die laufende Folge, links und rechts je zwei
# Nachbarn. Blättern mit den Pfeilen, per Wischen oder durch Antippen eines
# Nachbarn. Mittleres Cover antippen = diese Folge abspielen. Ohne Bedienung
# springt die Anzeige nach 15 s zurück.
#
# Daten: MQTT klangkiste/state · Bilder und Blättern: http://<box>/api/display…
# Secrets: wifi_ssid, wifi_password, cyd_heizung__encryption_key,
#          klangkiste_mqtt_user, klangkiste_mqtt_password
# =======================================================================
substitutions:
  box: "192.168.178.63"          # Adresse der Klangkiste
  broker: "192.168.178.55"       # Home Assistant mit Mosquitto
  prefix: "klangkiste"           # Themen-Präfix aus den Box-Einstellungen

esphome:
  name: cyd-heizung              # Name bleibt, damit Updates per WLAN weiter klappen
  friendly_name: Klangkiste-Display
  on_boot:
    then:
      - script.execute: backlight_timeout

esp32:
  board: esp32dev
  framework:
    type: arduino

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Klangkiste-Display Hotspot"

logger:
api:
  encryption:
    key: !secret cyd_heizung__encryption_key
ota:
  - platform: esphome

http_request:
  useragent: esphome/klangkiste-display
  timeout: 8s

mqtt:
  broker: ${broker}
  username: !secret klangkiste_mqtt_user
  password: !secret klangkiste_mqtt_password
  discovery: false
  topic_prefix: klangkiste-display
  log_topic: null
  on_json_message:
    - topic: ${prefix}/state
      then:
        - lambda: |-
            std::string st = x["state"] | "stop";
            std::string title = x["title"] | "";
            std::string folder = x["folder"] | "";
            std::string series = x["series"] | "";
            bool spotify = x["spotify"] | false;
            int ep = x["episode"] | 0, eps = x["episodes"] | 0;
            int tr = x["track"] | 0, trs = x["tracks"] | 0;

            id(k_playing) = (st == "play");
            id(k_elapsed) = x["elapsed"] | 0.0f;
            id(k_duration) = x["duration"] | 0.0f;

            std::string top;
            if (spotify) top = "Spotify";
            else if (!series.empty()) top = series;
            else if (!folder.empty()) {
              size_t p = folder.rfind('/');
              top = p == std::string::npos ? folder : folder.substr(p + 1);
            }
            id(k_top) = top;
            id(k_title) = title.empty() ? (folder.empty() && !spotify ? "Nichts ausgewählt" : "") : title;

            std::string sub;
            if (eps > 1) sub = "Folge " + to_string(ep) + " von " + to_string(eps);
            else if (trs > 1) sub = "Titel " + to_string(tr) + " von " + to_string(trs);
            id(k_sub) = sub;

            std::string img = x["image_v"] | "idle";
            id(k_img_changed) = (img != id(k_image_v));
            id(k_image_v) = img;
        - if:
            condition:
              lambda: 'return !id(k_browse);'
            then:
              - script.execute: refresh_ui
              - if:
                  condition:
                    lambda: 'return id(k_img_changed);'
                  then:
                    - script.execute: show_current_image
                    # neue Figur aufgelegt: Display einschalten
                    - light.turn_on: display_backlight
                    - script.execute: backlight_timeout

online_image:
  - id: kk_cover
    url: "http://${box}/api/display/strip.jpg?bg=0A1929"
    format: JPEG
    type: RGB565
    buffer_size: 24000
    update_interval: never
    on_download_finished:
      - lvgl.image.update:
          id: cover_img
          src: kk_cover

# -----------------------------------------------------------------------
# Hardware (wie bisher)
# -----------------------------------------------------------------------
spi:
  - id: bus_tft
    clk_pin: GPIO14
    mosi_pin: GPIO13
    miso_pin: GPIO12
  - id: bus_touch
    clk_pin: GPIO25
    mosi_pin: GPIO32
    miso_pin: GPIO39

display:
  - platform: ili9xxx
    id: my_display
    model: ILI9341
    spi_id: bus_tft
    cs_pin: GPIO15
    dc_pin: GPIO2
    dimensions:
      width: 320
      height: 240
    color_order: rgb
    # Helligkeitskurve (Gamma) für dieses Panel, sonst wirken Mitteltöne zu hell
    init_sequence:
      - [0x26, 0x01]
      - [0xE0, 0x00, 0x0C, 0x11, 0x04, 0x11, 0x08, 0x37, 0x89, 0x4C, 0x06, 0x0C, 0x0A, 0x2E, 0x34, 0x0F]
      - [0xE1, 0x00, 0x0B, 0x11, 0x05, 0x13, 0x09, 0x33, 0x67, 0x48, 0x07, 0x0E, 0x0B, 0x23, 0x33, 0x0F]
    invert_colors: false
    update_interval: never

touchscreen:
  - platform: xpt2046
    id: my_touch
    spi_id: bus_touch
    cs_pin: GPIO33
    interrupt_pin: GPIO36
    update_interval: 50ms
    threshold: 400
    transform:
      swap_xy: true
      mirror_x: true
      mirror_y: true
    calibration:
      x_min: 340
      x_max: 3860
      y_min: 300
      y_max: 3860
    on_touch:
      - light.turn_on: display_backlight
      - script.execute: backlight_timeout

output:
  - platform: ledc
    pin: GPIO21
    id: backlight_pwm
    frequency: 1000Hz

light:
  - platform: monochromatic
    output: backlight_pwm
    name: "Display Hintergrundbeleuchtung"
    id: display_backlight
    restore_mode: ALWAYS_ON
    default_transition_length: 400ms

# -----------------------------------------------------------------------
# Zustand
# -----------------------------------------------------------------------
globals:
  - { id: k_playing, type: bool, initial_value: "false" }
  - { id: k_elapsed, type: float, initial_value: "0" }
  - { id: k_duration, type: float, initial_value: "0" }
  - { id: k_top, type: std::string, initial_value: '""' }
  - { id: k_title, type: std::string, initial_value: '"Verbinde …"' }
  - { id: k_sub, type: std::string, initial_value: '""' }
  - { id: k_image_v, type: std::string, initial_value: '""' }
  - { id: k_img_changed, type: bool, initial_value: "false" }
  # Blättern
  - { id: k_browse, type: bool, initial_value: "false" }
  - { id: k_pos, type: int, initial_value: "0" }
  - { id: b_ok, type: bool, initial_value: "false" }
  - { id: b_name, type: std::string, initial_value: '""' }
  - { id: b_top, type: std::string, initial_value: '""' }
  - { id: b_sub, type: std::string, initial_value: '""' }
  - { id: b_folder, type: std::string, initial_value: '""' }

script:
  - id: backlight_timeout
    mode: restart
    then:
      - delay: 60s
      - light.turn_off: display_backlight

  - id: show_current_image
    then:
      - online_image.set_url:
          id: kk_cover
          url: !lambda 'return std::string("http://${box}/api/display/strip.jpg?bg=0A1929&v=") + id(k_image_v);'
      - component.update: kk_cover

  # Anzeige „Läuft“
  - id: refresh_ui
    mode: queued
    then:
      - lvgl.label.update: { id: lbl_top, text: !lambda 'return id(k_top);' }
      - lvgl.label.update: { id: lbl_title, text: !lambda 'return id(k_title);' }
      - lvgl.label.update: { id: lbl_sub, text: !lambda 'return id(k_sub);', text_color: 0x90A4AE }
      - lvgl.widget.show: [bar_pos, lbl_el, lbl_du]
      - lvgl.widget.hide: lbl_hint
      - script.execute: refresh_time

  - id: refresh_time
    then:
      - lvgl.bar.update:
          id: bar_pos
          value: !lambda |-
            if (id(k_duration) <= 0) return 0;
            return (int) (1000.0f * std::min(id(k_elapsed), id(k_duration)) / id(k_duration));
      - lvgl.label.update:
          id: lbl_el
          text: !lambda |-
            int s = (int) id(k_elapsed);
            return id(k_duration) > 0 ? str_sprintf("%d:%02d", s / 60, s % 60) : std::string("");
      - lvgl.label.update:
          id: lbl_du
          text: !lambda |-
            int s = (int) id(k_duration);
            return s > 0 ? str_sprintf("%d:%02d", s / 60, s % 60) : std::string("");

  # Blättern: dir = +1 weiter, -1 zurück. Die Box liefert Name und Ordner des Eintrags.
  - id: browse
    mode: single
    parameters:
      dir: int
    then:
      - light.turn_on: display_backlight
      - script.execute: backlight_timeout
      - http_request.get:
          url: !lambda |-
            if (id(k_browse)) return str_sprintf("http://${box}/api/display/browse?pos=%d", id(k_pos) + dir);
            return str_sprintf("http://${box}/api/display/browse?step=%d", dir);
          capture_response: true
          max_response_buffer_size: 2048
          on_error:
            then:
              - lvgl.label.update: { id: lbl_sub, text: "Box nicht erreichbar", text_color: 0xFF8A65 }
          on_response:
            then:
              - lambda: |-
                  id(b_ok) = false;
                  if (response->status_code != 200) return;
                  json::parse_json(body, [](JsonObject root) -> bool {
                    int count = root["count"] | 0;
                    if (count < 1) return true;
                    id(k_pos) = root["pos"] | 0;
                    id(b_name) = root["name"] | "";
                    id(b_top) = root["top"] | "";
                    id(b_sub) = root["sub"] | "";
                    id(b_folder) = root["folder"] | "";
                    id(b_ok) = true;
                    return true;
                  });
              - if:
                  condition:
                    lambda: 'return !id(b_ok);'
                  then:
                    - lvgl.label.update:
                        id: lbl_sub
                        text_color: 0xFF8A65
                        text: !lambda |-
                          if (response->status_code == 404) return std::string("Bitte zuerst die Box aktualisieren");
                          return str_sprintf("Blättern geht nicht (Antwort %d)", response->status_code);
              - if:
                  condition:
                    lambda: 'return id(b_ok);'
                  then:
                    - lambda: 'id(k_browse) = true;'
                    - lvgl.label.update: { id: lbl_top, text: !lambda 'return id(b_top);' }
                    - lvgl.label.update: { id: lbl_title, text: !lambda 'return id(b_name);' }
                    - lvgl.label.update: { id: lbl_sub, text: !lambda 'return id(b_sub);', text_color: 0xFF8A65 }
                    - lvgl.widget.hide: [bar_pos, lbl_el, lbl_du]
                    - lvgl.widget.show: lbl_hint
                    - online_image.set_url:
                        id: kk_cover
                        url: !lambda 'return str_sprintf("http://${box}/api/display/strip.jpg?bg=0A1929&pos=%d", id(k_pos));'
                    - component.update: kk_cover
                    - script.execute: browse_timeout

  - id: browse_timeout
    mode: restart
    then:
      - delay: 15s
      - script.execute: browse_end

  - id: browse_end
    then:
      - script.stop: browse_timeout
      - lambda: 'id(k_browse) = false;'
      - script.execute: refresh_ui
      - script.execute: show_current_image

  # Cover angetippt: beim Blättern die gezeigte Folge abspielen
  - id: cover_tap
    then:
      - if:
          condition:
            lambda: 'return id(k_browse) && !id(b_folder).empty();'
          then:
            - mqtt.publish:
                topic: "${prefix}/cmd/play_folder"
                payload: !lambda 'return id(b_folder);'
            - lvgl.label.update: { id: lbl_sub, text: "wird abgespielt …" }
            - lvgl.widget.hide: lbl_hint
            - script.stop: browse_timeout
            - delay: 1500ms
            - script.execute: browse_end

interval:
  - interval: 1s
    then:
      - if:
          condition:
            lambda: 'return id(k_playing) && !id(k_browse);'
          then:
            - lambda: 'id(k_elapsed) += 1.0f;'
            - script.execute: refresh_time

font:
  - file: "gfonts://Montserrat@600"
    id: font_12
    size: 12
    glyphs: &glyphs " !\"#$%&'()*+,-./0123456789:;<=>?@ABCDEFGHIJKLMNOPQRSTUVWXYZ[]_abcdefghijklmnopqrstuvwxyz|~°´·–—‘’‚“”„…ÄÖÜäöüßÀÁÂÇÈÉÊËÎÏÑÓÔÙÚÛàáâçèéêëîïñóôùúû€"
  - file: "gfonts://Montserrat@700"
    id: font_18
    size: 18
    glyphs: *glyphs

# -----------------------------------------------------------------------
# Oberfläche
# -----------------------------------------------------------------------
lvgl:
  buffer_size: 25%
  displays: my_display
  touchscreens: my_touch
  style_definitions:
    - id: st_arrow
      bg_color: 0x14283A
      bg_opa: COVER
      radius: 14
      border_width: 0
      shadow_width: 0
  widgets:
    - obj:
        id: root
        x: 0
        y: 0
        width: 320
        height: 240
        radius: 0
        border_width: 0
        pad_all: 0
        bg_color: 0x0A1929
        bg_opa: COVER
        scrollable: false
        on_swipe_left:
          - script.execute: { id: browse, dir: 1 }
        on_swipe_right:
          - script.execute: { id: browse, dir: -1 }
        widgets:
          # Karussell (320 × 100, kommt fertig von der Box)
          - image:
              id: cover_img
              src: kk_cover
              x: 0
              y: 4
          # unsichtbare Tippflächen über den fünf Covern
          - obj:
              x: 0
              y: 0
              width: 44
              height: 104
              radius: 0
              border_width: 0
              bg_opa: TRANSP
              scrollable: false
              clickable: true
              on_click:
                - script.execute: { id: browse, dir: -2 }
          - obj:
              x: 44
              y: 0
              width: 64
              height: 104
              radius: 0
              border_width: 0
              bg_opa: TRANSP
              scrollable: false
              clickable: true
              on_click:
                - script.execute: { id: browse, dir: -1 }
          - obj:
              x: 108
              y: 0
              width: 104
              height: 104
              radius: 0
              border_width: 0
              bg_opa: TRANSP
              scrollable: false
              clickable: true
              on_click:
                - script.execute: cover_tap
          - obj:
              x: 212
              y: 0
              width: 64
              height: 104
              radius: 0
              border_width: 0
              bg_opa: TRANSP
              scrollable: false
              clickable: true
              on_click:
                - script.execute: { id: browse, dir: 1 }
          - obj:
              x: 276
              y: 0
              width: 44
              height: 104
              radius: 0
              border_width: 0
              bg_opa: TRANSP
              scrollable: false
              clickable: true
              on_click:
                - script.execute: { id: browse, dir: 2 }

          # Pfeile
          - button:
              styles: st_arrow
              x: 6
              y: 114
              width: 52
              height: 86
              on_click:
                - script.execute: { id: browse, dir: -1 }
              widgets:
                - label: { align: CENTER, text: "", text_font: montserrat_28, text_color: 0xE1F5FE }
          - button:
              styles: st_arrow
              x: 262
              y: 114
              width: 52
              height: 86
              on_click:
                - script.execute: { id: browse, dir: 1 }
              widgets:
                - label: { align: CENTER, text: "", text_font: montserrat_28, text_color: 0xE1F5FE }

          # Texte zwischen den Pfeilen
          - label:
              id: lbl_top
              x: 64
              y: 112
              width: 192
              text: ""
              text_align: CENTER
              long_mode: DOT
              text_color: 0x6BA3B8
              text_font: font_12
          - label:
              id: lbl_title
              x: 64
              y: 130
              width: 192
              height: 46
              text: "Verbinde …"
              text_align: CENTER
              long_mode: DOT
              text_color: 0xE1F5FE
              text_font: font_18
          - label:
              id: lbl_sub
              x: 64
              y: 182
              width: 192
              text: ""
              text_align: CENTER
              long_mode: DOT
              text_color: 0x90A4AE
              text_font: font_12

          # Fortschritt (nur bei „Läuft“)
          - label: { id: lbl_el, x: 10, y: 214, width: 44, text: "", text_color: 0x90A4AE, text_font: font_12 }
          - bar:
              id: bar_pos
              x: 56
              y: 219
              width: 208
              height: 6
              min_value: 0
              max_value: 1000
              value: 0
              bg_color: 0x1B3A4B
              radius: 3
              indicator:
                bg_color: 0xFF7043
                radius: 3
          - label: { id: lbl_du, x: 266, y: 214, width: 44, text: "", text_align: RIGHT, text_color: 0x90A4AE, text_font: font_12 }

          # Hinweis (nur beim Blättern)
          - label:
              id: lbl_hint
              hidden: true
              x: 10
              y: 214
              width: 300
              text: "  Mitte antippen zum Abspielen"
              text_align: CENTER
              text_color: 0x6BA3B8
              text_font: montserrat_14
