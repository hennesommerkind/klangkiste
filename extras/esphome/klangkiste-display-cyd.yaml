# =======================================================================
# CYD (ESP32-2432S028, 320×240, Touch) als Display für die Klangkiste
#
# Oben ein Karussell: in der Mitte groß die laufende Folge, dahinter links und
# rechts je ein Nachbar. Blättern mit den Pfeilen unten, per Wischen oder
# durch Antippen eines Nachbarn. Mittleres Cover antippen = abspielen
# (Blättern allein ändert die Wiedergabe nicht).
# Der Knopf in der Mitte unten wechselt eine Ebene höher (Serien statt Folgen).
# Ohne Bedienung springt die Anzeige nach 5 s zur laufenden Folge zurück.
#
# Einzelne Hörspiele und Musikalben zeigen nur ihr Cover – dort gibt es nichts
# zu blättern. Liegt keine Figur auf und läuft nichts, zeigt das Display nach
# ein paar Sekunden ein Ruhebild; Blättern ist dann abgeschaltet.
# Folgen ohne eigenes Bild (oder mit demselben wie eine andere Folge) bekommen
# von der Box eine Nummer ins Cover.
#
# Daten: MQTT klangkiste/state · Bilder und Blättern: http://<box>/api/display…
# Secrets: wifi_ssid, wifi_password, cyd_heizung__encryption_key,
#          klangkiste_mqtt_user, klangkiste_mqtt_password
# =======================================================================
substitutions:
  box: "192.168.178.63"          # Adresse der Klangkiste
  broker: "192.168.178.55"       # Home Assistant mit Mosquitto
  prefix: "klangkiste"           # Themen-Präfix aus den Box-Einstellungen
  # Größe des Karussellbilds in Pixeln. Es braucht breite × hoehe × 2 Bytes Arbeitsspeicher am Stück;
  # rund 64.000 laufen sicher. Meldet das Display „Bild passt nicht in den Speicher“, hoehe verkleinern.
  # rand = (320 - breite) / 2, damit das Bild mittig sitzt.
  hoehe: "128"
  breite: "248"
  rand: "36"
  anzahl: "3"                    # 3 = je ein Nachbar links und rechts, 5 = je zwei (dann breite 320, rand 0)

esphome:
  name: cyd-heizung              # Name bleibt, damit Updates per WLAN weiter klappen
  friendly_name: Klangkiste-Display
  on_boot:
    then:
      - script.execute: backlight_timeout

esp32:
  board: esp32dev
  framework:
    type: arduino

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Klangkiste-Display Hotspot"

logger:
api:
  encryption:
    key: !secret cyd_heizung__encryption_key
ota:
  - platform: esphome

http_request:
  useragent: esphome/klangkiste-display
  timeout: 8s

mqtt:
  broker: ${broker}
  username: !secret klangkiste_mqtt_user
  password: !secret klangkiste_mqtt_password
  discovery: false
  topic_prefix: klangkiste-display
  log_topic: null
  on_json_message:
    - topic: ${prefix}/state
      then:
        - lambda: |-
            std::string st = x["state"] | "stop";
            id(k_playing) = (st == "play");
            id(k_elapsed) = x["elapsed"] | 0.0f;
            id(k_duration) = x["duration"] | 0.0f;
            id(k_idle) = x["idle"] | false;
            // Bild neu laden, wenn sich Cover/Figur oder die Folge geändert haben
            std::string img = x["image_v"] | "idle";
            img += "-" + to_string((int) (x["episode"] | 0));
            id(k_img_changed) = (img != id(k_image_v));
            id(k_image_v) = img;
        - if:
            condition:
              lambda: 'return !id(k_browse);'
            then:
              - script.execute: refresh_time
              - if:
                  condition:
                    lambda: 'return id(k_img_changed);'
                  then:
                    - if:
                        condition:
                          lambda: 'return id(k_idle);'
                        then:
                          # Figur abgenommen: erst nach ein paar Sekunden aufs Ruhebild (kein Flackern,
                          # wenn die Figur nur kurz verrutscht)
                          - script.execute: idle_later
                        else:
                          - script.stop: idle_later
                          - script.execute: show_current_image
                          - light.turn_on: display_backlight
                          - script.execute: backlight_timeout

# Das Karussell ist EIN Bild: jedes weitere Bild kostet den ESP32 einen eigenen Dekoder und Ladepuffer
online_image:
  - id: kk_strip
    url: "http://${box}/api/display/strip.jpg?bg=0A1929&h=${hoehe}&w=${breite}&n=${anzahl}"
    format: JPEG
    type: RGB565
    buffer_size: 16000
    update_interval: never
    on_download_finished:
      - lvgl.image.update: { id: img_strip, src: kk_strip }
      - lambda: 'id(k_have_img) = true;'
    on_error:
      - lvgl.label.update: { id: lbl_info, text: "Bild passt nicht in den Speicher" }

# -----------------------------------------------------------------------
# Hardware (wie bisher)
# -----------------------------------------------------------------------
spi:
  - id: bus_tft
    clk_pin: GPIO14
    mosi_pin: GPIO13
    miso_pin: GPIO12
  - id: bus_touch
    clk_pin: GPIO25
    mosi_pin: GPIO32
    miso_pin: GPIO39

display:
  - platform: ili9xxx
    id: my_display
    model: ILI9341
    spi_id: bus_tft
    cs_pin: GPIO15
    dc_pin: GPIO2
    dimensions:
      width: 320
      height: 240
    color_order: rgb
    # Helligkeitskurve (Gamma) für dieses Panel, sonst wirken Mitteltöne zu hell
    init_sequence:
      - [0x26, 0x01]
      - [0xE0, 0x00, 0x0C, 0x11, 0x04, 0x11, 0x08, 0x37, 0x89, 0x4C, 0x06, 0x0C, 0x0A, 0x2E, 0x34, 0x0F]
      - [0xE1, 0x00, 0x0B, 0x11, 0x05, 0x13, 0x09, 0x33, 0x67, 0x48, 0x07, 0x0E, 0x0B, 0x23, 0x33, 0x0F]
    invert_colors: false
    update_interval: never

touchscreen:
  - platform: xpt2046
    id: my_touch
    spi_id: bus_touch
    cs_pin: GPIO33
    interrupt_pin: GPIO36
    update_interval: 50ms
    threshold: 400
    transform:
      swap_xy: true
      mirror_x: true
      mirror_y: true
    calibration:
      x_min: 340
      x_max: 3860
      y_min: 300
      y_max: 3860
    on_touch:
      - light.turn_on: display_backlight
      - script.execute: backlight_timeout

output:
  - platform: ledc
    pin: GPIO21
    id: backlight_pwm
    frequency: 1000Hz

light:
  - platform: monochromatic
    output: backlight_pwm
    name: "Display Hintergrundbeleuchtung"
    id: display_backlight
    restore_mode: ALWAYS_ON
    default_transition_length: 400ms

# -----------------------------------------------------------------------
# Zustand
# -----------------------------------------------------------------------
globals:
  - { id: k_playing, type: bool, initial_value: "false" }
  - { id: k_elapsed, type: float, initial_value: "0" }
  - { id: k_duration, type: float, initial_value: "0" }
  - { id: k_image_v, type: std::string, initial_value: '""' }
  - { id: k_img_changed, type: bool, initial_value: "false" }
  - { id: k_have_img, type: bool, initial_value: "false" }
  - { id: k_idle, type: bool, initial_value: "false" }     # keine Figur, nichts läuft: Ruhebild
  # Blättern
  - { id: k_browse, type: bool, initial_value: "false" }
  - { id: k_up, type: bool, initial_value: "false" }
  - { id: k_pos, type: int, initial_value: "0" }
  - { id: b_ok, type: bool, initial_value: "false" }
  - { id: b_empty, type: bool, initial_value: "false" }    # hier gibt es nichts zu blättern
  - { id: b_sub, type: std::string, initial_value: '""' }
  - { id: b_folder, type: std::string, initial_value: '""' }

script:
  - id: backlight_timeout
    mode: restart
    then:
      - delay: 60s
      - light.turn_off: display_backlight

  # Karussell laden: beim Blättern der gewählte Eintrag in der Mitte, sonst der laufende
  - id: load_strip
    mode: restart
    then:
      - online_image.set_url:
          id: kk_strip
          url: !lambda |-
            std::string u = "http://${box}/api/display/strip.jpg?bg=0A1929&h=${hoehe}&w=${breite}&n=${anzahl}";
            if (id(k_browse)) u += str_sprintf("&pos=%d", id(k_pos)); else u += "&v=" + id(k_image_v);
            if (id(k_up)) u += "&up=1";
            return u;

  - id: show_current_image
    then:
      - script.execute: load_strip

  # Ruhebild mit Verzögerung
  - id: idle_later
    mode: restart
    then:
      - delay: 5s
      - if:
          condition:
            lambda: 'return id(k_idle) && !id(k_browse);'
          then:
            - lvgl.label.update: { id: lbl_info, text: "" }
            - lvgl.bar.update: { id: bar_pos, value: 0 }
            - script.execute: load_strip

  - id: refresh_time
    then:
      - lvgl.bar.update:
          id: bar_pos
          value: !lambda |-
            if (id(k_duration) <= 0) return 0;
            return (int) (1000.0f * std::min(id(k_elapsed), id(k_duration)) / id(k_duration));

  # Blättern: dir = Schritte (+ weiter, - zurück). Die Box liefert Nummer und Ordner des Eintrags.
  - id: browse
    mode: single
    parameters:
      dir: int
    then:
      - light.turn_on: display_backlight
      - script.execute: backlight_timeout
      - if:
          condition:
            lambda: 'return !id(k_idle);'    # Ruhebild: gestartet wird mit der Figur, nicht am Display
          then:
              - http_request.get:
                  url: !lambda |-
                    std::string u = id(k_browse) ? str_sprintf("http://${box}/api/display/browse?pos=%d", id(k_pos) + dir)
                                                 : str_sprintf("http://${box}/api/display/browse?step=%d", dir);
                    if (id(k_up)) u += "&up=1";
                    return u;
                  capture_response: true
                  max_response_buffer_size: 2048
                  on_error:
                    then:
                      - lvgl.label.update: { id: lbl_info, text: "Box nicht erreichbar" }
                  on_response:
                    then:
                      - lambda: |-
                          id(b_ok) = false;
                          id(b_empty) = false;
                          if (response->status_code != 200) return;
                          json::parse_json(body, [](JsonObject root) -> bool {
                            int count = root["count"] | 0;
                            if (count < 1) { id(b_empty) = true; return true; }   // einzelnes Hörspiel: nichts zu blättern
                            id(k_pos) = root["pos"] | 0;
                            id(b_sub) = root["sub"] | "";
                            id(b_folder) = root["folder"] | "";
                            id(b_ok) = true;
                            return true;
                          });
                      - if:
                          condition:
                            lambda: 'return !id(b_ok) && !id(b_empty);'
                          then:
                            - lvgl.label.update:
                                id: lbl_info
                                text: !lambda |-
                                  if (response->status_code == 404) return std::string("Bitte zuerst die Box aktualisieren");
                                  return str_sprintf("Geht nicht (Antwort %d)", response->status_code);
                      - if:
                          condition:
                            lambda: 'return id(b_ok);'
                          then:
                            - lambda: 'id(k_browse) = true;'
                            - lvgl.label.update: { id: lbl_info, text: !lambda 'return id(b_sub);' }
                            - script.execute: load_strip
                            - script.execute: browse_timeout

  - id: browse_timeout
    mode: restart
    then:
      - delay: 5s
      - script.execute: browse_end

  - id: browse_end
    then:
      - script.stop: browse_timeout
      - lambda: |-
          id(k_browse) = false;
          id(k_up) = false;
      - lvgl.label.update: { id: lbl_info, text: "" }
      - lvgl.obj.update: { id: btn_up, bg_color: 0x14283A }
      - script.execute: refresh_time
      - script.execute: load_strip

  # Ebene wechseln: Folgen der Serie <-> alle Serien/Hörspiele
  - id: toggle_level
    then:
      - if:
          condition:
            lambda: 'return !id(k_idle);'
          then:
            - lambda: |-
                id(k_up) = !id(k_up);
                id(k_browse) = false;
            - lvgl.obj.update:
                id: btn_up
                bg_color: !lambda 'return id(k_up) ? lv_color_hex(0xFF7043) : lv_color_hex(0x14283A);'
            - script.execute: { id: browse, dir: 0 }

  # Mitte angetippt: beim Blättern den gezeigten Eintrag abspielen
  - id: cover_tap
    then:
      - if:
          condition:
            lambda: 'return id(k_browse) && !id(b_folder).empty();'
          then:
            - mqtt.publish:
                topic: "${prefix}/cmd/play_episode"
                payload: !lambda 'return id(b_folder);'
            - script.stop: browse_timeout
            - delay: 1200ms
            - script.execute: browse_end

interval:
  - interval: 1s
    then:
      - if:
          condition:
            lambda: 'return id(k_playing) && !id(k_browse);'
          then:
            - lambda: 'id(k_elapsed) += 1.0f;'
            - script.execute: refresh_time
  # Fehlt das Bild noch (z. B. Box war beim Start nicht erreichbar), später erneut versuchen
  - interval: 30s
    then:
      - if:
          condition:
            lambda: 'return !id(k_browse) && !id(k_have_img);'
          then:
            - script.execute: load_strip

font:
  - file: "gfonts://Montserrat@600"
    id: font_12
    size: 12
    glyphs: &glyphs " !\"#$%&'()*+,-./0123456789:;<=>?@ABCDEFGHIJKLMNOPQRSTUVWXYZ[]_abcdefghijklmnopqrstuvwxyz|~°´·–—‘’‚“”„…ÄÖÜäöüßÀÁÂÇÈÉÊËÎÏÑÓÔÙÚÛàáâçèéêëîïñóôùúû€"
  - file: "gfonts://Montserrat@700"
    id: font_18
    size: 18
    glyphs: *glyphs

# -----------------------------------------------------------------------
# Oberfläche
# -----------------------------------------------------------------------
lvgl:
  buffer_size: 8%               # kleiner Zeichenpuffer lässt mehr Speicher für die Bilder
  displays: my_display
  touchscreens: my_touch
  style_definitions:
    - id: st_arrow
      bg_color: 0x14283A
      bg_opa: COVER
      radius: 12
      border_width: 0
      shadow_width: 0
  widgets:
    - obj:
        id: root
        x: 0
        y: 0
        width: 320
        height: 240
        radius: 0
        border_width: 0
        pad_all: 0
        bg_color: 0x0A1929
        bg_opa: COVER
        scrollable: false
        on_swipe_left:
          - script.execute: { id: browse, dir: 1 }
        on_swipe_right:
          - script.execute: { id: browse, dir: -1 }
        widgets:
          # Karussell (kommt fertig von der Box)
          - image: { id: img_strip, src: kk_strip, x: "${rand}", y: 6 }
          # unsichtbare Tippflächen: links = zurück, Mitte = abspielen, rechts = weiter
          - obj:
              x: 0
              y: 0
              width: 98
              height: 148
              radius: 0
              border_width: 0
              bg_opa: TRANSP
              scrollable: false
              clickable: true
              on_click:
                - script.execute: { id: browse, dir: -1 }
          - obj:
              x: 98
              y: 0
              width: 124
              height: 148
              radius: 0
              border_width: 0
              bg_opa: TRANSP
              scrollable: false
              clickable: true
              on_click:
                - script.execute: cover_tap
          - obj:
              x: 222
              y: 0
              width: 98
              height: 148
              radius: 0
              border_width: 0
              bg_opa: TRANSP
              scrollable: false
              clickable: true
              on_click:
                - script.execute: { id: browse, dir: 1 }

          # Fortschritt
          - bar:
              id: bar_pos
              x: 10
              y: 154
              width: 300
              height: 5
              min_value: 0
              max_value: 1000
              value: 0
              bg_color: 0x1B3A4B
              radius: 3
              indicator:
                bg_color: 0xFF7043
                radius: 3

          # Position beim Blättern („4 / 37“) und Fehlermeldungen
          - label:
              id: lbl_info
              x: 10
              y: 166
              width: 300
              text: ""
              text_align: CENTER
              long_mode: DOT
              text_color: 0xFF8A65
              text_font: font_12

          # Pfeile und Ebenenwechsel
          - button:
              styles: st_arrow
              x: 8
              y: 190
              width: 84
              height: 44
              on_click:
                - script.execute: { id: browse, dir: -1 }
              widgets:
                - label: { align: CENTER, text: "", text_font: montserrat_20, text_color: 0xE1F5FE }
          - button:
              id: btn_up
              styles: st_arrow
              x: 124
              y: 190
              width: 72
              height: 44
              on_click:
                - script.execute: toggle_level
              widgets:
                - label: { align: CENTER, text: "", text_font: montserrat_20, text_color: 0xE1F5FE }
          - button:
              styles: st_arrow
              x: 228
              y: 190
              width: 84
              height: 44
              on_click:
                - script.execute: { id: browse, dir: 1 }
              widgets:
                - label: { align: CENTER, text: "", text_font: montserrat_20, text_color: 0xE1F5FE }
