name: Android-App

# Baut die Android-App (Hülle um die Weboberfläche) und legt sie als Release ab.
# Die Box lädt sie beim Update von dort und bietet sie in den Einstellungen zum Herunterladen an.
on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      # Signaturschlüssel: bevorzugt aus den Repository-Secrets (KLANGKISTE_KEYSTORE als Base64,
      # KLANGKISTE_KEYSTORE_PASS). Fehlen sie, wird ein Schlüssel im Cache der Actions gehalten;
      # verfällt der Cache, entsteht ein neuer – dann die alte App einmal deinstallieren.
      - name: Signaturschlüssel aus dem Cache
        uses: actions/cache@v4
        with:
          path: ~/.klangkiste-signing
          key: klangkiste-signing-v1
      - name: Signaturschlüssel bereitstellen
        env:
          KS_B64: ${{ secrets.KLANGKISTE_KEYSTORE }}
          KS_SECRET_PASS: ${{ secrets.KLANGKISTE_KEYSTORE_PASS }}
        run: |
          mkdir -p ~/.klangkiste-signing
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > ~/.klangkiste-signing/secret.keystore
            echo "KS_STORE=$HOME/.klangkiste-signing/secret.keystore" >> "$GITHUB_ENV"
            echo "::add-mask::$KS_SECRET_PASS"
            echo "KS_PASS=$KS_SECRET_PASS" >> "$GITHUB_ENV"
          else
            if [ ! -f ~/.klangkiste-signing/cache.keystore ]; then
              openssl rand -hex 24 > ~/.klangkiste-signing/pass
              keytool -genkeypair -keystore ~/.klangkiste-signing/cache.keystore -alias klangkiste \
                -storepass "$(cat ~/.klangkiste-signing/pass)" -keypass "$(cat ~/.klangkiste-signing/pass)" \
                -keyalg RSA -keysize 2048 -validity 20000 -dname "CN=Klangkiste"
            fi
            echo "::add-mask::$(cat ~/.klangkiste-signing/pass)"
            echo "KS_STORE=$HOME/.klangkiste-signing/cache.keystore" >> "$GITHUB_ENV"
            echo "KS_PASS=$(cat ~/.klangkiste-signing/pass)" >> "$GITHUB_ENV"
          fi
      - name: App bauen
        run: gradle -p android :app:assembleRelease --no-daemon
      - name: Umbenennen
        run: cp android/app/build/outputs/apk/release/app-release.apk klangkiste.apk
      - name: Als Release veröffentlichen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-${{ github.run_number }}
          name: Android-App ${{ github.run_number }}
          body: Android-App der Klangkiste. Wird bei jedem Update auf die Box geladen und dort unter Einstellungen › „Als App installieren“ angeboten.
          files: klangkiste.apk
          make_latest: true
