# Von Klangkiste verwaltet – Änderungen werden beim nächsten install.sh überschrieben.
music_directory     "/var/lib/klangkiste/music"
playlist_directory  "/var/lib/mpd/playlists"
db_file             "/var/lib/mpd/tag_cache"
state_file          "/var/lib/mpd/state"
sticker_file        "/var/lib/mpd/sticker.sql"
user                "mpd"
bind_to_address     "127.0.0.1"
port                "6600"
log_file            "syslog"
log_level           "default"
auto_update         "no"
restore_paused      "yes"
filesystem_charset  "UTF-8"

audio_output {
    type        "alsa"
    name        "Lautsprecher"
    device      "default"
    mixer_type  "software"
}

# Stream fürs Haus (MusicCast über Home Assistant): http://<box>:8000/klangkiste.mp3
audio_output {
    type        "httpd"
    name        "Hausstream"
    encoder     "lame"
    port        "8000"
    bitrate     "192"
    format      "44100:16:2"
    always_on   "yes"
    tags        "yes"
    enabled     "no"
    mixer_type  "null"
}
