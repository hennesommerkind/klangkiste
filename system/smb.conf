# Von der Klangkiste verwaltet – Änderungen gehen beim nächsten Update verloren.
[global]
   server role = standalone server
   map to guest = never
   server min protocol = SMB2
   disable netbios = yes
   smb ports = 445
   load printers = no
   printing = bsd
   printcap name = /dev/null
   disable spoolss = yes
   log file = /var/log/samba/log.%m
   max log size = 200

[Klangkiste]
   comment = Hörspiele und Musik
   path = /var/lib/klangkiste/music
   valid users = klangkiste
   force user = klangkiste
   force group = klangkiste
   read only = no
   create mask = 0644
   directory mask = 0755
