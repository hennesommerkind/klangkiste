# Von Klangkiste verwaltet. Mischt Karten-Wiedergabe (MPD) und Spotify auf
# dieselbe Soundkarte. CARDNAME wird von install.sh ersetzt.
pcm.!default {
    type plug
    slave.pcm "klangkiste"
}
pcm.klangkiste {
    type dmix
    ipc_key 5978293
    ipc_key_add_uid false
    ipc_perm 0666
    slave {
        pcm "hw:CARD=CARDNAME,DEV=0"
        rate 44100
        channels 2
        format S16_LE
        period_size 1024
        buffer_size 8192
    }
}
ctl.!default {
    type hw
    card CARDNAME
}
